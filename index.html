<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phos Academy — Learning Portal</title>

<!--
  ============================================================================
  PHOS ACADEMY LMS — SETUP INSTRUCTIONS
  ============================================================================
  This file needs a free Firebase project to store data (students, grades,
  messages, etc.) so it works across every device/browser, not just one.

  1. Go to https://console.firebase.google.com and create a free project
     (no credit card needed on the free "Spark" plan).
  2. In the project, click "Build > Firestore Database" > Create database
     > Start in "test mode" (you'll tighten rules below).
  3. Click the gear icon > Project settings > scroll to "Your apps" >
     click the </> (web) icon > register the app (any nickname).
  4. Firebase will show you a firebaseConfig object. Copy it and paste it
     over the placeholder FIREBASE_CONFIG object below (search for
     "PASTE YOUR FIREBASE CONFIG HERE").
  5. In Firestore > Rules, paste this (then click Publish):

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /{document=**} {
             allow read, write: if true;
           }
         }
       }

     NOTE ON SECURITY: this file checks the admin/student passwords in the
     browser, not on a server, so it is NOT bank-grade security. Anyone who
     obtained your Firebase config AND guessed/knew a password could read or
     change data directly. That's an acceptable trade-off for a small private
     tutoring site with no server, but do NOT reuse a sensitive password for
     the admin account, and don't publish the site link publicly — share it
     only with your students/parents.
  6. Upload this single file to GitHub Pages (or any static host) the same
     way you did for the Quantum Leap Schools admission portal, and it's live.
  7. Change the admin password by editing ADMIN_USERNAME / ADMIN_PASSWORD
     below before you deploy.
  ============================================================================
-->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#f6f7f8;
    --surface:#ffffff;
    --text:#1c2230;
    --muted:#68707e;
    --border:#e4e7eb;
    --accent:#0f6e5e;
    --accent-dark:#0a4f43;
    --accent-soft:#e6f2ef;
    --danger:#b3261e;
    --danger-soft:#fbeceb;
    --warn:#9a6700;
    --warn-soft:#fdf3d9;
    --good:#166534;
    --good-soft:#e8f5ea;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .hidden{display:none !important;}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  /* ---------- top nav ---------- */
  header.topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;}
  .brand-mark{
    width:32px;height:32px;border-radius:8px;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  }
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;
  }
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-danger{background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:6px;}
  .btn-block{width:100%;}
  .btn-whatsapp{background:#25D366;border-color:#25D366;color:#fff;}
  .btn-whatsapp:hover{background:#1ebe5b;}

  /* ---------- layout ---------- */
  main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  h1{font-size:26px;margin:0 0 6px;}
  h2{font-size:19px;margin:0 0 12px;}
  h3{font-size:15px;margin:0 0 8px;}
  p.muted, .muted{color:var(--muted);}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--text);}
  input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],
  select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);
  }
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;}
  .badge-good{background:var(--good-soft);color:var(--good);}
  .badge-warn{background:var(--warn-soft);color:var(--warn);}
  .badge-bad{background:var(--danger-soft);color:var(--danger);}
  .badge-muted{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.02em;}
  .empty{color:var(--muted);font-style:italic;padding:10px 0;}

  /* tabs */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .tab-btn{
    background:none;border:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;
  }
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* home page */
  .hero{
    background:linear-gradient(160deg,var(--accent) 0%,var(--accent-dark) 100%);
    color:#fff;border-radius:14px;padding:44px 30px;margin-bottom:24px;
  }
  .hero h1{font-size:34px;color:#fff;}
  .hero p{max-width:560px;color:#d9efe9;font-size:16px;}
  .hero .row{margin-top:18px;}
  .feature{padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
  .feature h3{color:var(--accent-dark);}
  .whatsapp-float{
    position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;border-radius:50px;
    padding:13px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center;
    z-index:60;text-decoration:none;font-size:14px;
  }

  /* login */
  .login-wrap{max-width:380px;margin:60px auto;}
  .login-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px;}
  .login-toggle button{flex:1;padding:10px;border:none;background:var(--surface);font-weight:700;color:var(--muted);}
  .login-toggle button.active{background:var(--accent);color:#fff;}
  .err-msg{color:var(--danger);font-size:13px;margin-top:8px;}

  /* notif dot */
  .dot{
    background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:800;
    padding:1px 6px;margin-left:6px;
  }
  .notif-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:14px;}
  .notif-item.unread{background:var(--accent-soft);border-color:var(--accent);}

  .msg-bubble{max-width:75%;padding:9px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;}
  .msg-from-admin{background:var(--accent-soft);margin-right:auto;border-bottom-left-radius:2px;}
  .msg-from-student{background:var(--bg);border:1px solid var(--border);margin-left:auto;border-bottom-right-radius:2px;}
  .msg-time{font-size:11px;color:var(--muted);margin-top:3px;}

  .q-block{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
  .opt-row{display:flex;align-items:center;gap:8px;margin:4px 0;}

  footer.appfoot{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 10px;}

  @media print{
    header.topbar,.tabs,.whatsapp-float,.no-print{display:none !important;}
    main{max-width:100%;padding:0;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand"><div class="brand-mark">P</div> Phos Academy</div>
  <div class="topbar-actions" id="topbarActions"></div>
</header>

<main id="app"></main>

<a class="whatsapp-float" id="waFloat" target="_blank">💬 Chat on WhatsApp</a>

<footer class="appfoot">Phos Academy Learning Portal</footer>

<script>
/* ============================================================================
   CONFIG — edit these before you deploy
   ========================================================================== */
const ACADEMY_NAME = "Phos Academy";
const WHATSAPP_NUMBER = "2347030589293"; // no + sign, no spaces
const ADMIN_USERNAME = "phosadmin";
const ADMIN_PASSWORD = "phosacad";

// PASTE YOUR FIREBASE CONFIG HERE (see instructions in the <head> comment)


// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCoxi8SmYDyXBi2AJyYXB0EUPygyJlcaKk",
  authDomain: "phos-lms.firebaseapp.com",
  projectId: "phos-lms",
  storageBucket: "phos-lms.firebasestorage.app",
  messagingSenderId: "1084788024856",
  appId: "1:1084788024856:web:5966186ec26b64f38b856d",
  measurementId: "G-60FT7XGB2E"
};

// Initialize Firebase
//const app = initializeApp(firebaseConfig);
//const analytics = getAnalytics(app);

const CLASS_LEVELS = ["JSS1","JSS2","JSS3","SS1","SS2","SS3"];
const SUBJECTS = ["Mathematics","Further Mathematics","Coding","English Language"];
const MODES = ["Home","After School at QLS","Online","Hybrid"];

/* ============================================================================
   FIREBASE INIT
   ========================================================================== */
let db = null;
let firebaseReady = false;
try{
  if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    firebaseReady = true;
  }
}catch(e){ console.error("Firebase init failed", e); }

function col(name){ return db.collection(name); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================================
   SESSION
   ========================================================================== */
function getSession(){ try{ return JSON.parse(localStorage.getItem("phos_session")||"null"); }catch(e){ return null; } }
function setSession(s){ localStorage.setItem("phos_session", JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem("phos_session"); }

/* ============================================================================
   ROOT RENDER
   ========================================================================== */
const app = document.getElementById("app");
const topbarActions = document.getElementById("topbarActions");
document.getElementById("waFloat").href = "https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent("Hello "+ACADEMY_NAME+", I'd like to enquire about lessons.");

let route = "home"; // home | login | admin | student

function render(){
  const session = getSession();
  renderTopbar(session);

  if(!firebaseReady && route !== "home"){
    app.innerHTML = `<div class="card"><h2>Setup needed</h2>
      <p class="muted">This portal isn't connected to a database yet. Open this file's source code and paste your Firebase project config where it says "PASTE YOUR FIREBASE CONFIG HERE" near the top of the &lt;script&gt; section. Setup steps are in a comment at the top of the file.</p></div>`;
    return;
  }

  if(session && session.role === "admin" && route !== "home"){ renderAdmin(); return; }
  if(session && session.role === "student" && route !== "home"){ renderStudent(); return; }

  if(route === "login"){ renderLogin(); return; }
  renderHome();
}

function renderTopbar(session){
  let html = "";
  if(session && session.role === "admin"){
    html = `<span class="muted" style="font-size:14px;">Admin</span> <button class="btn btn-sm" onclick="logout()">Log out</button>`;
  } else if(session && session.role === "student"){
    html = `<span class="muted" style="font-size:14px;">${esc(session.name||session.id)}</span> <button class="btn btn-sm" onclick="logout()">Log out</button>`;
  } else {
    html = `<button class="btn" onclick="goto('home')">Home</button> <button class="btn btn-primary" onclick="goto('login')">Log in</button>`;
  }
  topbarActions.innerHTML = html;
}

function goto(r){ route = r; render(); window.scrollTo(0,0); }
function logout(){ clearSession(); goto("home"); }

/* ============================================================================
   HOME PAGE
   ========================================================================== */
function renderHome(){
  app.innerHTML = `
    <div class="hero">
      <h1>${esc(ACADEMY_NAME)}</h1>
      <p>Focused, personal tutoring in Mathematics, Further Mathematics, Coding and English Language for JSS1–SS3 students — taught the way your child actually learns best.</p>
      <div class="row">
        <a class="btn btn-whatsapp" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Hello '+ACADEMY_NAME+', I would like to enquire about lessons.')}" target="_blank">💬 Message us on WhatsApp</a>
        <button class="btn" style="background:#fff;" onclick="goto('login')">Student / Admin Login</button>
      </div>
    </div>

    <div class="grid-3">
      <div class="feature"><h3>Small, personal classes</h3><p class="muted">Every learner is tracked individually — no one gets lost in a crowd.</p></div>
      <div class="feature"><h3>Flexible modes</h3><p class="muted">Learn at home, after school at QLS, fully online, or a hybrid mix — whatever fits your family.</p></div>
      <div class="feature"><h3>Real results, tracked</h3><p class="muted">Assessments, instant CBT feedback, and progress reports you and your child can actually see.</p></div>
    </div>

    <div class="card">
      <h2>Why parents choose ${esc(ACADEMY_NAME)}</h2>
      <ul>
        <li>Curriculum aligned to WAEC / NECO / BECE requirements from JSS1 through SS3.</li>
        <li>Subjects taught by a dedicated tutor who tracks every student's progress personally.</li>
        <li>Computer-based tests (CBT) with instant grading for objective assessments, and reviewed feedback on written work.</li>
        <li>Transparent, easy-to-reach communication — announcements, direct messages and a WhatsApp line always open.</li>
        <li>Clear fee tracking, so there's never confusion about what's owed or paid.</li>
      </ul>
    </div>

    <div class="card">
      <h2>Subjects &amp; Modes</h2>
      <div class="row" style="margin-bottom:10px;">
        ${SUBJECTS.map(s=>`<span class="badge badge-muted">${esc(s)}</span>`).join(" ")}
      </div>
      <div class="row">
        ${MODES.map(m=>`<span class="badge badge-good">${esc(m)}</span>`).join(" ")}
      </div>
    </div>

    <div class="card" style="text-align:center;">
      <h2>Already enrolled?</h2>
      <p class="muted">Students and the academy admin can log in below to access schedules, classes, assessments and reports.</p>
      <button class="btn btn-primary" onclick="goto('login')">Go to Login</button>
    </div>
  `;
}

/* ============================================================================
   LOGIN PAGE
   ========================================================================== */
let loginMode = "student";
function renderLogin(){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="card">
        <h2 style="text-align:center;">Log in to ${esc(ACADEMY_NAME)}</h2>
        <div class="login-toggle">
          <button id="tglStudent" class="${loginMode==='student'?'active':''}" onclick="setLoginMode('student')">Student</button>
          <button id="tglAdmin" class="${loginMode==='admin'?'active':''}" onclick="setLoginMode('admin')">Admin</button>
        </div>
        <label>${loginMode==='admin'?'Username':'Student ID'}</label>
        <input type="text" id="loginId" autocomplete="username">
        <label>Password</label>
        <input type="password" id="loginPw" autocomplete="current-password">
        <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="doLogin()">Log in</button>
        <div class="err-msg hidden" id="loginErr"></div>
      </div>
    </div>
  `;
}
function setLoginMode(m){ loginMode=m; renderLogin(); }

async function doLogin(){
  const idVal = document.getElementById("loginId").value.trim();
  const pw = document.getElementById("loginPw").value;
  const errEl = document.getElementById("loginErr");
  errEl.classList.add("hidden");

  if(loginMode === "admin"){
    if(idVal === ADMIN_USERNAME && pw === ADMIN_PASSWORD){
      setSession({role:"admin"});
      goto("admin");
    } else {
      errEl.textContent = "Incorrect admin username or password.";
      errEl.classList.remove("hidden");
    }
    return;
  }

  if(!idVal || !pw){
    errEl.textContent = "Enter your student ID and password.";
    errEl.classList.remove("hidden");
    return;
  }
  try{
    const doc = await col("students").doc(idVal).get();
    if(!doc.exists){
      errEl.textContent = "No student found with that ID.";
      errEl.classList.remove("hidden");
      return;
    }
    const data = doc.data();
    if(data.password !== pw){
      errEl.textContent = "Incorrect password.";
      errEl.classList.remove("hidden");
      return;
    }
    setSession({role:"student", id: idVal, name: data.name});
    goto("student");
  }catch(e){
    console.error(e);
    errEl.textContent = "Couldn't reach the database. Check your connection.";
    errEl.classList.remove("hidden");
  }
}

/* ============================================================================
   SHARED HELPERS: notifications
   ========================================================================== */
async function addNotification({audience, target, type, message, relatedId}){
  await col("notifications").add({
    audience, target: target||null, type, message, relatedId: relatedId||null,
    read:false, timestamp: nowISO()
  });
}
async function markNotifRead(id){
  await col("notifications").doc(id).update({read:true});
}

/* ============================================================================
   ============================  ADMIN AREA  ==================================
   ============================================================================ */
let adminTab = "overview";
let adminCache = { students:[], schedule:[], announcements:[], messages:[], assessments:[], submissions:[], notifications:[] };

async function loadAdminData(){
  const [studentsSnap, scheduleSnap, annSnap, msgSnap, assessSnap, subSnap, notifSnap] = await Promise.all([
    col("students").get(),
    col("schedule").get(),
    col("announcements").get(),
    col("messages").get(),
    col("assessments").get(),
    col("submissions").get(),
    col("notifications").where("audience","==","admin").get()
  ]);
  adminCache.students = studentsSnap.docs.map(d=>({id:d.id,...d.data()}));
  adminCache.schedule = scheduleSnap.docs.map(d=>({id:d.id,...d.data()}));
  adminCache.announcements = annSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
  adminCache.messages = msgSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  adminCache.assessments = assessSnap.docs.map(d=>({id:d.id,...d.data()}));
  adminCache.submissions = subSnap.docs.map(d=>({id:d.id,...d.data()}));
  adminCache.notifications = notifSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
}

async function renderAdmin(){
  app.innerHTML = `<div class="card">Loading admin dashboard…</div>`;
  await loadAdminData();
  const unread = adminCache.notifications.filter(n=>!n.read).length;

  app.innerHTML = `
    <h1>Admin Dashboard</h1>
    <div class="tabs">
      ${tabBtn("overview","Overview"+(unread?` <span class="dot">${unread}</span>`:""))}
      ${tabBtn("students","Students")}
      ${tabBtn("schedule","Schedule")}
      ${tabBtn("announcements","Announcements")}
      ${tabBtn("messages","Messages")}
      ${tabBtn("assessments","Assessments")}
      ${tabBtn("fees","Fees")}
      ${tabBtn("reports","Reports")}
    </div>
    <div id="adminTabBody"></div>
  `;
  renderAdminTabBody();
}
function tabBtn(key,label){
  return `<button class="tab-btn ${adminTab===key?'active':''}" onclick="setAdminTab('${key}')">${label}</button>`;
}
function setAdminTab(k){ adminTab=k; renderAdmin(); }

function renderAdminTabBody(){
  const el = document.getElementById("adminTabBody");
  if(adminTab==="overview") el.innerHTML = adminOverviewHTML();
  else if(adminTab==="students") el.innerHTML = adminStudentsHTML();
  else if(adminTab==="schedule") el.innerHTML = adminScheduleHTML();
  else if(adminTab==="announcements") el.innerHTML = adminAnnouncementsHTML();
  else if(adminTab==="messages") el.innerHTML = adminMessagesHTML();
  else if(adminTab==="assessments") el.innerHTML = adminAssessmentsHTML();
  else if(adminTab==="fees") el.innerHTML = adminFeesHTML();
  else if(adminTab==="reports") el.innerHTML = adminReportsHTML();
  wireAdminTabEvents();
}

/* ---------- Overview / Notifications ---------- */
function adminOverviewHTML(){
  const pendingReview = adminCache.submissions.filter(s=>s.status==="pending").length;
  const totalStudents = adminCache.students.length;
  const notifs = adminCache.notifications;
  return `
    <div class="grid-3">
      <div class="card"><h3>Total students</h3><p style="font-size:28px;font-weight:800;margin:0;">${totalStudents}</p></div>
      <div class="card"><h3>Theory submissions awaiting review</h3><p style="font-size:28px;font-weight:800;margin:0;color:${pendingReview?'var(--danger)':'var(--good)'};">${pendingReview}</p></div>
      <div class="card"><h3>Unread notifications</h3><p style="font-size:28px;font-weight:800;margin:0;">${notifs.filter(n=>!n.read).length}</p></div>
    </div>
    <div class="card">
      <h2>Notifications</h2>
      ${notifs.length? notifs.map(n=>`
        <div class="notif-item ${n.read?'':'unread'}">
          <div>${esc(n.message)}</div>
          <div class="row" style="justify-content:space-between;margin-top:4px;">
            <span class="muted" style="font-size:12px;">${fmtDate(n.timestamp)}</span>
            ${n.read?'':`<button class="btn btn-sm" data-notif="${n.id}">Mark read</button>`}
          </div>
        </div>`).join('') : `<div class="empty">No notifications yet.</div>`}
    </div>
  `;
}

async function registerStudent(){
  const id = document.getElementById("stuId").value.trim();
  const name = document.getElementById("stuName").value.trim();
  const pw = document.getElementById("stuPw").value.trim();
  const classLevel = document.getElementById("stuClass").value;
  const mode = document.getElementById("stuMode").value;
  const wa = document.getElementById("stuWa").value.trim();
  const subjects = [...document.querySelectorAll(".stuSubjChk:checked")].map(c=>c.value);
  const errEl = document.getElementById("regErr");
  if(!id || !name || !pw){
    errEl.textContent = "Student ID, name and password are required.";
    errEl.classList.remove("hidden");
    return;
  }
  const existing = await col("students").doc(id).get();
  if(existing.exists){
    errEl.textContent = "A student with that ID already exists.";
    errEl.classList.remove("hidden");
    return;
  }
  await col("students").doc(id).set({
    name, password: pw, classLevel, mode, subjects, whatsapp: wa,
    feesRecords: [], createdAt: nowISO()
  });
  await addNotification({audience:"admin", type:"info", message:`New student registered: ${name} (${id}).`});
  renderAdmin();
}

async function postAnnouncement(){
  const message = document.getElementById("annMsg").value.trim();
  if(!message){ alert("Write a message first."); return; }
  const doc = {audienceType: annAudienceType, message, timestamp: nowISO()};
  let recipients = [];
  if(annAudienceType==='all'){
    recipients = adminCache.students.map(s=>s.id);
  } else if(annAudienceType==='subject'){
    const subject = document.getElementById("annSubjectPick").value;
    doc.subject = subject;
    recipients = adminCache.students.filter(s=>(s.subjects||[]).includes(subject)).map(s=>s.id);
  } else if(annAudienceType==='specific'){
    const targets = [...document.querySelectorAll(".annTargetChk:checked")].map(c=>c.value);
    if(targets.length===0){ alert("Select at least one student."); return; }
    doc.targets = targets;
    recipients = targets;
  }
  await col("announcements").add(doc);
  for(const id of recipients){
    await addNotification({audience:id, type:"announcement", message:"New announcement posted — check the Announcements tab."});
  }
  await addNotification({audience:"admin", type:"info", message:`Announcement posted to ${recipients.length} student(s).`});
  document.getElementById("annMsg").value = "";
  renderAdmin();
}

function renderQuestionBuilder(){
  const type = document.getElementById("asType")?.value || "mcq";
  if(newAssessQuestions.length===0) newAssessQuestions.push(blankQuestion(type));
  return newAssessQuestions.map((q,i)=>{
    if(type==="mcq"){
      return `<div class="q-block">
        <label>Question ${i+1}</label>
        <input type="text" class="qText" data-i="${i}" value="${esc(q.q)}">
        ${[0,1,2,3].map(oi=>`
          <div class="opt-row">
            <input type="radio" name="correct${i}" ${q.correctIndex===oi?'checked':''} class="qCorrect" data-i="${i}" data-oi="${oi}">
            <input type="text" class="qOpt" data-i="${i}" data-oi="${oi}" placeholder="Option ${oi+1}" value="${esc(q.options[oi]||'')}" style="flex:1;">
          </div>`).join('')}
        ${newAssessQuestions.length>1?`<button class="btn btn-sm btn-danger" data-rm-q="${i}">Remove question</button>`:''}
      </div>`;
    } else {
      return `<div class="q-block">
        <label>Question ${i+1}</label>
        <input type="text" class="qText" data-i="${i}" value="${esc(q.q)}">
        ${newAssessQuestions.length>1?`<button class="btn btn-sm btn-danger" data-rm-q="${i}">Remove question</button>`:''}
      </div>`;
    }
  }).join('');
}
function blankQuestion(type){
  return type==="mcq" ? {q:"",options:["","","",""],correctIndex:0} : {q:""};
}
async function createAssessment(){

  const type = document.getElementById("asType").value;

  if(!title || newAssessQuestions.some(q=>!q.q.trim())){
    alert("Give the assessment a title and make sure every question has text.");
    return;
  }
  const doc = {title,subject,type,questions:newAssessQuestions,dueDate:dueDate||null,createdAt:nowISO()};
  let recipients = [];
  if(asAudienceType==='subject'){
    const classLevel = document.getElementById("asClass").value;
    doc.classLevel = classLevel;
    recipients = adminCache.students.filter(s=>(s.subjects||[]).includes(subject) && (classLevel==='all' || s.classLevel===classLevel)).map(s=>s.id);
  } else {
    const targets = [...document.querySelectorAll(".asTargetChk:checked")].map(c=>c.value);
    if(targets.length===0){ alert("Select at least one student."); return; }
    doc.classLevel = "all";
    doc.assignedTo = targets;
    recipients = targets;
  }
  await col("assessments").add(doc);
  newAssessQuestions = [];
  for(const id of recipients){
    await addNotification({audience:id, type:"announcement", message:`New ${type==='mcq'?'CBT':'assessment'} available: ${title}.`});

  renderAdmin();
}

function adminReportsHTML(){
  return `

function buildReport(){
  const id = document.getElementById("reportStudent").value;
  const s = adminCache.students.find(x=>x.id===id);
  const subs = adminCache.submissions.filter(x=>x.studentId===id);
  const bySubject = {};
  subs.forEach(sub=>{
    const a = adminCache.assessments.find(x=>x.id===sub.assessmentId);
    if(!a) return;
    const score = a.type==='mcq' ? sub.score : sub.theoryScore;
    if(score==null) return;
    bySubject[a.subject] = bySubject[a.subject] || [];
    bySubject[a.subject].push({title:a.title, score, type:a.type});
  });
  const recs = s.feesRecords||[];
  const totalDue = recs.reduce((a,r)=>a+Number(r.amountDue||0),0);
  const totalPaid = recs.reduce((a,r)=>a+Number(r.amountPaid||0),0);

  document.getElementById("reportOutput").innerHTML = `
    <div class="card">
      <div class="row no-print" style="justify-content:flex-end;"><button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button></div>
      <h1>${esc(ACADEMY_NAME)} — Student Report</h1>
      <p><strong>${esc(s.name)}</strong> (${esc(s.id)}) — ${esc(s.classLevel)} — Mode: ${esc(s.mode)}</p>
      <p class="muted">Subjects enrolled: ${(s.subjects||[]).join(', ')}</p>
      <h2>Assessment performance</h2>
      ${Object.keys(bySubject).length ? Object.entries(bySubject).map(([subj,items])=>{
        const avg = (items.reduce((a,i)=>a+Number(i.score||0),0)/items.length).toFixed(1);
        return `<h3>${esc(subj)} — average ${avg}%</h3>
          <table><tr><th>Assessment</th><th>Type</th><th>Score</th></tr>
          ${items.map(i=>`<tr><td>${esc(i.title)}</td><td>${i.type==='mcq'?'CBT':'Theory'}</td><td>${i.score}%</td></tr>`).join('')}
          </table>`;
      }).join('') : `<p class="empty">No graded assessments yet.</p>`}
      <h2>Fees</h2>
      <p>Total due: ₦${totalDue.toLocaleString()} &nbsp; Total paid: ₦${totalPaid.toLocaleString()} &nbsp; Balance: <strong>₦${(totalDue-totalPaid).toLocaleString()}</strong></p>
      <p class="muted" style="margin-top:20px;">Generated ${fmtDate(nowISO())}</p>
    </div>
  `;
}

/* ---------- wire admin events (delegated) ---------- */
function wireAdminTabEvents(){
  const el = document.getElementById("adminTabBody");
  if(!el) return;

  el.querySelectorAll("[data-notif]").forEach(b=>b.onclick=()=>markNotifRead(b.dataset.notif).then(renderAdmin));
  const regBtn = document.getElementById("btnRegisterStudent"); if(regBtn) regBtn.onclick = registerStudent;
  el.querySelectorAll("[data-edit-student]").forEach(b=>b.onclick=()=>openEditStudent(b.dataset.editStudent));
  el.querySelectorAll("[data-del-student]").forEach(b=>b.onclick=()=>deleteStudent(b.dataset.delStudent));

  const addSchBtn = document.getElementById("btnAddSchedule"); if(addSchBtn) addSchBtn.onclick = addScheduleEntry;
  el.querySelectorAll("[data-del-schedule]").forEach(b=>b.onclick=()=>deleteSchedule(b.dataset.delSchedule));

  const postAnnBtn = document.getElementById("btnPostAnnouncement"); if(postAnnBtn) postAnnBtn.onclick = postAnnouncement;
  if(!document.getElementById("annAudienceType")) annAudienceType = "all"; // reset when leaving the tab

  const targetType = document.getElementById("msgTargetType");
  if(targetType){
    const wrap = document.getElementById("msgTargetStudentWrap");
    if(targetType.value!=="direct" && wrap) wrap.style.display="none";
    if(targetType.value==="subject" && wrap){
      wrap.style.display="block";
      wrap.innerHTML = `<label>Subject group</label><select id="msgTargetStudent">${SUBJECTS.map(s=>`<option>${s}</option>`).join('')}</select>`;
    } else if(targetType.value==="direct" && wrap){
      wrap.innerHTML = `<label>Student</label><select id="msgTargetStudent">${adminCache.students.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.id})</option>`).join('')}</select>`;
    }
  }
  const sendBtn = document.getElementById("btnSendAdminMsg");
  if(sendBtn) sendBtn.onclick = async ()=>{
    const type = document.getElementById("msgTargetType").value;
    const body = document.getElementById("msgBody").value.trim();
    if(!body){ alert("Write a message first."); return; }
    if(type==="direct"){
      const target = document.getElementById("msgTargetStudent").value;
      await col("messages").add({direction:"admin-to-student", audience:"direct", target, message:body, timestamp:nowISO()});
      await addNotification({audience:target, type:"message", message:"You have a new message from admin."});
    } else if(type==="subject"){
      const subject = document.getElementById("msgTargetStudent").value;
      await col("messages").add({direction:"admin-to-student", audience:"subject", target:subject, message:body, timestamp:nowISO()});
      const recipients = adminCache.students.filter(s=>(s.subjects||[]).includes(subject));
      for(const r of recipients) await addNotification({audience:r.id, type:"message", message:`New message for ${subject} students.`});
    } else if(type==="all"){
      await col("messages").add({direction:"admin-to-student", audience:"all", target:null, message:body, timestamp:nowISO()});
      for(const s of adminCache.students) await addNotification({audience:s.id, type:"message", message:"You have a new message from admin."});
    }
    document.getElementById("msgBody").value = "";
    renderAdmin();
  };
  el.querySelectorAll("[data-open-thread]").forEach(b=>b.onclick=()=>openThread(b.dataset.openThread));

  const asType = document.getElementById("asType");
  if(asType) asType.onchange = ()=>{ newAssessQuestions=[]; renderAdmin(); };
  const qList = document.getElementById("asQuestionsList");
  if(qList){
    qList.querySelectorAll(".qText").forEach(inp=>inp.oninput = ()=>{ newAssessQuestions[inp.dataset.i].q = inp.value; });
    qList.querySelectorAll(".qOpt").forEach(inp=>inp.oninput = ()=>{ newAssessQuestions[inp.dataset.i].options[inp.dataset.oi] = inp.value; });
    qList.querySelectorAll(".qCorrect").forEach(inp=>inp.onchange = ()=>{ newAssessQuestions[inp.dataset.i].correctIndex = Number(inp.dataset.oi); });
    qList.querySelectorAll("[data-rm-q]").forEach(b=>b.onclick=()=>{ newAssessQuestions.splice(Number(b.dataset.rmQ),1); renderAdmin(); });
  }
  const addQBtn = document.getElementById("btnAddQuestion");
  if(addQBtn) addQBtn.onclick = ()=>{ const type=document.getElementById("asType").value; newAssessQuestions.push(blankQuestion(type)); renderAdmin(); };
  const createAssessBtn = document.getElementById("btnCreateAssessment");
  if(createAssessBtn) createAssessBtn.onclick = createAssessment;
  el.querySelectorAll("[data-grade-sub]").forEach(b=>b.onclick=()=>openGradeModal(b.dataset.gradeSub));

  el.querySelectorAll("[data-fees-student]").forEach(b=>b.onclick=()=>openFeesModal(b.dataset.feesStudent));
  el.querySelectorAll("[data-rm-fee]").forEach(b=>b.onclick=()=>removeFeeRecord(b.dataset.feeStudent, Number(b.dataset.rmFee)));

  const buildReportBtn = document.getElementById("btnBuildReport");
  if(buildReportBtn) buildReportBtn.onclick = buildReport;
}

let studentTab = "overview";
let studentCache = {student:null, schedule:[], announcements:[], messages:[], assessments:[], submissions:[], notifications:[]};

async function loadStudentData(){
  const session = getSession();
  const studentDoc = await col("students").doc(session.id).get();
  const student = {id:session.id, ...studentDoc.data()};
  const [scheduleSnap, annSnap, msgSnap, assessSnap, subSnap, notifSnap] = await Promise.all([
    col("schedule").get(),
    col("announcements").get(),
    col("messages").get(),
    col("assessments").get(),
    col("submissions").where("studentId","==",session.id).get(),
    col("notifications").where("audience","==",session.id).get()
  ]);
  studentCache.student = student;
  studentCache.schedule = scheduleSnap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>(s.classLevel==='all'||s.classLevel===student.classLevel) && (student.subjects||[]).includes(s.subject));
  studentCache.announcements = annSnap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>{
    if(a.audienceType==='specific') return (a.targets||[]).includes(session.id);
    if(a.audienceType==='subject') return (student.subjects||[]).includes(a.subject);
    if(a.audienceType==='all') return true;
    return a.subject==='all' || (student.subjects||[]).includes(a.subject); // backward compat
  }).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
  studentCache.messages = msgSnap.docs.map(d=>({id:d.id,...d.data()})).filter(m =>
      (m.direction==="student-to-admin" && m.studentId===session.id) ||
      (m.direction==="admin-to-student" && m.audience==="all") ||
      (m.direction==="admin-to-student" && m.audience==="direct" && m.target===session.id) ||
      (m.direction==="admin-to-student" && m.audience==="subject" && (student.subjects||[]).includes(m.target))
    ).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  studentCache.assessments = assessSnap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>{
    if(a.assignedTo) return a.assignedTo.includes(session.id);
    return (a.classLevel==='all' || a.classLevel===student.classLevel) && (student.subjects||[]).includes(a.subject);
  });
  studentCache.submissions = subSnap.docs.map(d=>({id:d.id,...d.data()}));
  studentCache.notifications = notifSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
}

  app.innerHTML = `<div class="card">Loading your portal…</div>`;

    <p class="muted">${esc(studentCache.student.classLevel)} · ${(studentCache.student.subjects||[]).join(', ')} · ${esc(studentCache.student.mode)}</p>

      ${sTabBtn("schedule","Schedule & Classes")}

}

let currentAssessAnswers = [];
function openTakeAssessment(assessId){
  const a = studentCache.assessments.find(x=>x.id===assessId);
  currentAssessAnswers = a.questions.map(()=> a.type==='mcq' ? null : "");
  document.getElementById("assessModalHost").innerHTML = `
    <div class="card" style="border-color:var(--accent);">
      <h2>${esc(a.title)}</h2>
      ${a.questions.map((q,i)=>{
        if(a.type==='mcq'){
          return `<div class="q-block">
            <div style="font-weight:600;">Q${i+1}: ${esc(q.q)}</div>
            ${q.options.map((opt,oi)=>`
              <div class="opt-row"><input type="radio" name="ans${i}" class="ansMcq" data-i="${i}" data-oi="${oi}"> <span>${esc(opt)}</span></div>`).join('')}
          </div>`;
        } else {
          return `<div class="q-block">
            <div style="font-weight:600;">Q${i+1}: ${esc(q.q)}</div>
            <textarea class="ansTheory" data-i="${i}" placeholder="Type your answer..."></textarea>
          </div>`;
        }
      }).join('')}
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-primary" id="btnSubmitAssess" data-id="${a.id}">Submit</button>
        <button class="btn" onclick="document.getElementById('assessModalHost').innerHTML=''">Cancel</button>
      </div>
    </div>
  `;
  document.getElementById("assessModalHost").querySelectorAll(".ansMcq").forEach(r=>r.onchange=()=>{ currentAssessAnswers[r.dataset.i]=Number(r.dataset.oi); });
  document.getElementById("assessModalHost").querySelectorAll(".ansTheory").forEach(t=>t.oninput=()=>{ currentAssessAnswers[t.dataset.i]=t.value; });
  document.getElementById("btnSubmitAssess").onclick = ()=>submitAssessment(a.id);
}
async function submitAssessment(assessId){
  const a = studentCache.assessments.find(x=>x.id===assessId);
  const session = getSession();
  const submission = {
    assessmentId: assessId, studentId: session.id, answers: currentAssessAnswers,
    submittedAt: nowISO()
  };
  if(a.type==='mcq'){
    let correct = 0;
    a.questions.forEach((q,i)=>{ if(currentAssessAnswers[i]===q.correctIndex) correct++; });
    const score = Math.round((correct/a.questions.length)*100);
    submission.status = "graded";
    submission.score = score;
  } else {
    submission.status = "pending";
    await addNotification({audience:"admin", type:"assessment-submitted", message:`${session.name} submitted "${a.title}" for review.`});
  }
  await col("submissions").add(submission);
  document.getElementById("assessModalHost").innerHTML = "";
  renderStudent();
}

        <div class="q-block">
          <div style="font-weight:600;">Q${i+1}: ${esc(q.q)}</div>
          <div style="margin-top:4px;">Your answer: ${a.type==='mcq' ? esc(q.options[sub.answers[i]] ?? '(none)') : esc(sub.answers[i]||'(none)')}</div>
          ${a.type==='mcq' ? `<div class="muted">Correct answer: ${esc(q.options[q.correctIndex])}</div>` : ''}
        </div>`).join('')}
      <p>${a.type==='mcq' ? `Score: <strong>${sub.score}%</strong>` : (sub.status==='pending' ? 'Awaiting review.' : `Score: <strong>${sub.theoryScore}%</strong>${sub.feedback?` — Feedback: ${esc(sub.feedback)}`:''}`)}</p>
      <button class="btn" onclick="document.getElementById('assessModalHost').innerHTML=''">Close</button>
    </div>
  `;
}

function wireStudentTabEvents(){
  const el = document.getElementById("studentTabBody");
  if(!el) return;
  el.querySelectorAll("[data-snotif]").forEach(b=>b.onclick=()=>markNotifRead(b.dataset.snotif).then(renderStudent));
  const sendBtn = document.getElementById("btnStudentSendMsg");
  if(sendBtn) sendBtn.onclick = async ()=>{
    const body = document.getElementById("stuMsgBody").value.trim();
    if(!body) return;
    const session = getSession();
    await col("messages").add({direction:"student-to-admin", studentId:session.id, message:body, timestamp:nowISO(), read:false});
    await addNotification({audience:"admin", type:"message", message:`New message from ${session.name}.`});
    renderStudent();
  };
  el.querySelectorAll("[data-take-assess]").forEach(b=>b.onclick=()=>openTakeAssessment(b.dataset.takeAssess));
  el.querySelectorAll("[data-view-assess]").forEach(b=>b.onclick=()=>viewAssessResult(b.dataset.viewAssess));
}

/* ============================================================================
   BOOT
   ========================================================================== */
render();
</script>
</body>
</html>
